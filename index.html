<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolokvij Projekt Redizajn</title>
    <link rel="stylesheet" href="jquery_ui/jquery-ui.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>Kolokvij</h1>
            <button id="theme-switcher" aria-label="Toggle Dark Mode">🌓</button>
        </header>

        <div id="tabs">
            <ul>
                <li><a href="#prosjek">Prosjek</a></li>
                <li><a href="#mobiteli">Mobiteli</a></li>
            </ul>
            <div id="prosjek">
                <div class="input-group">
                    <label>Broj 1: <input type="number" class="broj" value="0"></label>
                    <label>Broj 2: <input type="number" class="broj" value="0"></label>
                    <label>Broj 3: <input type="number" class="broj" value="0"></label>
                    <label>Broj 4: <input type="number" class="broj" value="0"></label>
                </div>
                <p class="result">Prosjek: <span id="rezultat_prosjeka">0.00</span></p>
            </div>
            <div id="mobiteli">
                <div class="filter-bar">
                    <label for="godina_select">Godina proizvodnje: </label>
                    <select id="godina_select">
                    </select>
                </div>
                <hr>
                <div class="table-container">
                    <table id="mobiteli_table">
                        <thead>
                            <tr>
                                <th>Proizvođač</th>
                                <th>Logo</th>
                                <th>Model</th>
                                <th>Oznaka</th>
                                <th>God. Proizv.</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="jquery-3.7.1.min.js"></script>
    <script src="jquery_ui/jquery-ui.min.js"></script>
    <script src="skripte.js"></script>
</body>
</html>
